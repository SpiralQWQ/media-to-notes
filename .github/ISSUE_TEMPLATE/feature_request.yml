name: Feature request / 功能建议
description: Suggest a new feature or improvement / 建议新功能或改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem you're solving / 要解决的问题
      description: Describe the pain point, not just the feature name / 描述痛点，而不是只给功能名
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example input → expected output / 具体输入输出例子
      description: A concrete example of what should happen / 一个具体的预期行为例子
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Does this affect the two-stage CLI contract or the note spec? / 是否影响两阶段 CLI 契约或笔记规范？
      options:
        - No, additive only / 否，纯增量
        - Yes, CLI contract / 是，影响 CLI
        - Yes, note spec (spec/note_style_spec.md) / 是，影响笔记规范
        - Not sure / 不确定
    validations:
      required: true
